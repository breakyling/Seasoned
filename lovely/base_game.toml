[manifest]
version = "1.0.0"
priority = 0


# Add blind_reward_bonus to every blind's reward
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = """
self.dollars = blind and blind.dollars or 0
"""
position = "after"
payload = """
self.dollars = (blind and blind.dollars + G.GAME.starting_params.blind_reward_bonus) or 0
"""
match_indent = true