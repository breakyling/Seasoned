[manifest]
version = "1.0.0"
priority = 0


# 4 hands, 3 discards -> 3 hands, 4 discards
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = """
discards = 3,
hands = 4,
"""
position = "at"
payload = """
discards = 4,
hands = 3,
"""
match_indent = true


# Add blind_reward_bonus as a new starting parameter
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = """
vouchers_in_shop = 1,
"""
position = "after"
payload = """
blind_reward_bonus = 0,
"""
match_indent = true


# Apply any deck or stake's blind_reward_bonus modifier to the blind_reward_bonus in starting_params
[[patches]]
[patches.pattern]
target = "back.lua"
pattern = """
if self.effect.config.extra_discard_bonus then 
    G.GAME.modifiers.money_per_discard = self.effect.config.extra_discard_bonus
end
"""
position = "after"
payload = """
if self.effect.config.blind_reward_bonus then
    G.GAME.starting_params.blind_reward_bonus = G.GAME.starting_params.blind_reward_bonus + self.effect.config.blind_reward_bonus
end
"""
match_indent = true


# Add blind_reward_bonus to every blind's reward
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = """
self.dollars = blind and blind.dollars or 0
"""
position = "after"
payload = """
self.dollars = (blind and blind.dollars or 0) + G.GAME.starting_params.blind_reward_bonus
"""
match_indent = true