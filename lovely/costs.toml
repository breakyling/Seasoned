[manifest]
version = "1.0.0"
priority = 0


# If a Joker has config.extra.force_cost = true, then its set cost cannot be overriden
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = """
function Card:set_cost_value()
"""
position = "after"
payload = """
    if self.ability.extra and type(self.ability.extra) == "table" and self.ability.extra.force_cost then
        self.cost = self.base_cost
        return
    end
"""
match_indent = true


# Perishable Jokers now cost half as much
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = """
self.cost = math.max(1, math.floor((self.base_cost + self.extra_cost + 0.5)*(100-G.GAME.discount_percent)/100))
"""
position = "at"
payload = """
self.cost = math.max(1, math.floor((self.base_cost + self.extra_cost + 0.5)*(100-G.GAME.discount_percent)/(self.ability.perishable and 2 or 1)/100))
"""
match_indent = true


